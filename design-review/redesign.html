<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>CPAMC redesign prototype · Sample data</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; }
#root {
  container-type: inline-size; container-name: app;
  font-family: var(--font-sans); font-size: 14px; line-height: 1.45; color: var(--foreground);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --radius: 8px; --radius-sm: 6px; --radius-lg: 12px;
}
#root[data-theme="dark"] {
  color-scheme: dark;
  --background: #0d0f11; --foreground: #eceef0; --card: #14171a; --secondary: #1b1f23; --muted: #1b1f23;
  --muted-foreground: #9aa1a9; --faint: #80878f; --border: #252a2f; --border-strong: #353b42; --input: #101316;
  --ring: #5cc8db; --primary: #eceef0; --primary-foreground: #0d0f11; --accent: #5cc8db; --accent-soft: rgba(92,200,219,.12);
  --destructive: #f06a5b; --destructive-soft: rgba(240,106,91,.12); --warning: #e8a93b; --warning-soft: rgba(232,169,59,.12);
  --success: #3ccf8e; --success-soft: rgba(60,207,142,.12); --info: #7cb3ff; --info-soft: rgba(124,179,255,.12);
  --code-background: #0a0c0e; --sidebar: #101215; --overlay: rgba(4,6,8,.62);
  --chart-1: #5cc8db; --chart-2: #3ccf8e; --chart-3: #e8a93b; --chart-4: #f06a5b; --chart-5: #a993ff; --chart-6: #d8c650;
  --grid: #20252a; --proposal: #a993ff; --proposal-soft: rgba(169,147,255,.12);
}
#root[data-theme="light"] {
  color-scheme: light;
  --background: #fbfaf7; --foreground: #1d1b18; --card: #ffffff; --secondary: #f2f0eb; --muted: #f2f0eb;
  --muted-foreground: #625d56; --faint: #736d65; --border: #e4e0d8; --border-strong: #cfcac0; --input: #ffffff;
  --ring: #0b7285; --primary: #1d1b18; --primary-foreground: #ffffff; --accent: #0b7285; --accent-soft: rgba(11,114,133,.09);
  --destructive: #b83a2b; --destructive-soft: rgba(184,58,43,.08); --warning: #8f5a00; --warning-soft: rgba(196,128,0,.1);
  --success: #1a7f4e; --success-soft: rgba(26,127,78,.09); --info: #1f5fbf; --info-soft: rgba(31,95,191,.08);
  --code-background: #f4f2ed; --sidebar: #f6f4ef; --overlay: rgba(30,27,22,.38);
  --chart-1: #0b8aa0; --chart-2: #1f9a5e; --chart-3: #b77700; --chart-4: #c8473a; --chart-5: #6f55d9; --chart-6: #9c8a12;
  --grid: #ece8e0; --proposal: #6f55d9; --proposal-soft: rgba(111,85,217,.09);
}
#root *, #root *::before, #root *::after { box-sizing: border-box; }
#root [hidden] { display: none !important; }
.select.sm { height: 28px; font-size: 12.5px; width: auto; background-position: calc(100% - 15px) 11px, calc(100% - 10px) 11px; }
:where(#root) :where(h1,h2,h3,h4,p,ul,ol,dl,dd,figure) { margin: 0; }
:where(#root) :where(ul,ol) { padding: 0; list-style: none; }
:where(#root) :where(button, input, select, textarea) { font: inherit; color: inherit; }
:where(#root) a { color: var(--accent); text-decoration: none; }
:where(#root) a:hover { text-decoration: underline; }
:where(#root) a.btn:hover, :where(#root) .nav a:hover, :where(#root) a.tab:hover { text-decoration: none; }
#root :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.faint { color: var(--faint); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 14px; height: 14px; }
.skip { position: absolute; left: 12px; top: -40px; z-index: 50; background: var(--primary); color: var(--primary-foreground) !important; padding: 8px 12px; border-radius: 6px; }
.skip:focus { top: 8px; }

/* Shell */
.app { position: relative; background: var(--background); min-height: 960px; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.app.no-shell { grid-template-columns: minmax(0, 1fr); }
.app.no-shell .sidebar { display: none; }
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); padding: 14px 10px 16px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.brand img { width: 30px; height: 30px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.brand b { display: block; font-size: 14px; letter-spacing: .01em; }
.brand span { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.nav-group { padding-top: 10px; }
.nav-group-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 0 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--muted-foreground); font-weight: 500; position: relative; }
.nav a:hover { background: var(--secondary); color: var(--foreground); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--secondary); color: var(--foreground); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav a[aria-current="page"] .ic { color: var(--accent); }
.nav .badge { margin-left: auto; }
.nav-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); display: grid; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; flex: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.head-stack { position: sticky; top: 0; z-index: 10; }
.demo-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 24px; font-size: 12px; font-weight: 600; letter-spacing: .01em; color: var(--proposal); background: color-mix(in srgb, var(--background) 82%, var(--proposal) 18%); border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, var(--proposal) 50%); }
.demo-strip .ic { color: var(--proposal); }
.demo-strip .sep { opacity: .55; }
.topbar { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 24px; background: color-mix(in srgb, var(--background) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; color: var(--muted-foreground); }
.crumbs b { color: var(--foreground); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.topbar .menu-btn { display: none; }
.page { padding: 28px 32px 56px; width: 100%; max-width: 1280px; }
.page-enter { animation: pageIn .16s ease-out both; }
@keyframes pageIn { from { opacity: .001; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Page header */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -.015em; }
.page-head h1:focus { outline: none; }
.page-head h1.hero { font-size: 30px; line-height: 36px; letter-spacing: -.025em; }
.page-head h1.hero .period { color: var(--success); }
.page-head h1.hero.warn .period { color: var(--warning); }
.status-line { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
.status-line > span + span::before { content: "·"; margin-right: 10px; color: var(--faint); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag-sample { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--proposal); background: var(--proposal-soft); border: 1px dashed color-mix(in srgb, var(--proposal) 55%, transparent); padding: 1px 7px; border-radius: 999px; }
.tag-proposal { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--proposal); background: var(--proposal-soft); border: 1px dashed color-mix(in srgb, var(--proposal) 55%, transparent); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.status-line > .tag-sample::before, .status-line > .tag-proposal::before { content: none !important; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--secondary); color: var(--foreground); font-weight: 550; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, transform .08s; }
.btn:hover { background: color-mix(in srgb, var(--secondary) 80%, var(--foreground) 8%); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--background)); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted-foreground); }
.btn-ghost:hover { background: var(--secondary); color: var(--foreground); }
.btn-danger { background: transparent; color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 45%, transparent); }
.btn-danger:hover { background: var(--destructive-soft); }
.btn-danger-solid { background: var(--destructive); border-color: var(--destructive); color: #fff; }
.btn-sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; border-style: dashed; }
.icon-btn { width: 34px; padding: 0; }
.icon-btn.btn-sm { width: 28px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 550; }
.link-btn:hover { text-decoration: underline; }

/* Inputs */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 550; }
.field .hint { font-size: 12px; color: var(--muted-foreground); }
.yaml { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); font-weight: 400; margin-left: 6px; }
.input, .select, .textarea { width: 100%; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--input); padding: 0 10px; color: var(--foreground); }
.textarea { height: auto; min-height: 96px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; resize: vertical; }
.select { appearance: none; -webkit-appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%), linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 0; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--destructive) !important; }
.err { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; color: var(--destructive); }
.err:empty { display: none; }
.search { position: relative; flex: 1 1 240px; min-width: 180px; max-width: 420px; }
.search .ic { position: absolute; left: 10px; top: 9px; color: var(--faint); pointer-events: none; }
.search .input { padding-left: 32px; }
.switch { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border-strong); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch:checked { background: var(--success); }
.switch:checked::after { transform: translateX(14px); }
.switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.check { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.switch-row:last-child { border-bottom: 0; }
.switch-row .label { display: block; }
.switch-row .hint { display: block; font-size: 12.5px; color: var(--muted-foreground); margin-top: 2px; max-width: 62ch; }

/* Shared chart treatment: the production candidate is Recharts; this review stays dependency-free. */
.line-panel { overflow: hidden; }
.line-panel .panel-head { align-items: flex-start; }
.line-headline { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.line-headline strong { font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.line-legend { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px; }
.line-key { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; color: var(--foreground); background: transparent; cursor: pointer; font-size: 12px; }
.line-key[aria-pressed="false"] { color: var(--muted-foreground); border-style: dashed; }
.line-key i { width: 18px; height: 2px; background: var(--series-color); flex: none; }
.line-key .series-number { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border-strong); border-radius: 4px; color: var(--foreground); font: 600 11px var(--font-mono); flex: none; }
.line-key .series-name { min-width: 0; }
.line-svg .series-label { fill: var(--foreground); paint-order: stroke; stroke: var(--card); stroke-width: 4px; font-weight: 700; }
.line-key b { font-variant-numeric: tabular-nums; font-weight: 600; }
.line-key small { color: var(--muted-foreground); }
.line-plot { padding: 0 12px; }
.line-svg { width: 100%; display: block; overflow: visible; }
.line-svg text { font: 11px var(--font-mono); fill: var(--muted-foreground); }
.line-svg .line-grid { stroke: var(--grid); stroke-width: 1; }
.line-svg .line-trace { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.line-svg .line-projection { stroke-dasharray: 5 5; }
.line-svg .line-hit { fill: transparent; cursor: crosshair; }
.line-svg:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.line-svg:focus-visible .line-cursor { stroke: var(--ring); opacity: 1; }
.line-cursor { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0; }
.line-readout { min-height: 38px; padding: 8px 16px; font: 12px/1.5 var(--font-mono); color: var(--muted-foreground); }
.line-explainer { display: flex; gap: 8px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.line-explainer .ic { margin-top: 1px; }
.quota-sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
.quota-sync .dot { color: var(--success); margin-top: 5px; }
.quota-sync { align-items: flex-start; }
.quota-sync[data-partial="true"] .dot { color: var(--warning); }
.quota-sync[aria-busy="true"] .dot { color: var(--info); }
#quota-sync { margin-bottom: 12px; }
.quota-filters, .quota-scenarios { margin: 0 0 12px; }
.quota-filters summary, .quota-scenarios summary { cursor: pointer; min-height: 36px; padding: 8px 0; color: var(--muted-foreground); font-size: 12.5px; }
.quota-filters[open] summary { margin-bottom: 8px; }
.quota-scenarios { margin-top: 20px; }
.page-head:has([data-act="quotaAll"]) { margin-bottom: 10px; align-items: flex-start; }
@container app (max-width: 768px) {
  .line-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding-left: 12px; padding-right: 12px; }
  .line-key { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; text-align: left; min-height: 44px; padding: 6px; }
  .line-key .series-name { overflow-wrap: anywhere; }
  .line-key small { grid-column: 2 / -1; }
  .line-plot { padding: 0 4px; }
  .page-head:has([data-act="quotaAll"]) > div:first-child { flex: 1; min-width: 0; }
  .page-head:has([data-act="quotaAll"]) .actions { width: auto; flex: 0 0 auto; }
  [data-act="quotaAll"] { width: 36px; padding: 0; }
  [data-act="quotaAll"] span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
}

/* Segmented and tabs */
.seg { display: inline-flex; padding: 2px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); gap: 2px; flex-wrap: wrap; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); cursor: pointer; font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--secondary); color: var(--foreground); box-shadow: inset 0 0 0 1px var(--border-strong); }
.seg .count { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: thin; }
.tabs [role="tab"], .tabs a.tab { height: 38px; padding: 0 12px; border: 0; background: none; color: var(--muted-foreground); font-weight: 550; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
.tabs [aria-selected="true"], .tabs a.tab[aria-current="page"] { color: var(--foreground); border-bottom-color: var(--accent); }
.tabs a.tab:hover { text-decoration: none; color: var(--foreground); }
.tabs .count { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

/* Tags, badges */
.badge { font-family: var(--font-mono); font-size: 11px; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: var(--secondary); color: var(--muted-foreground); border: 1px solid var(--border); }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 550; background: var(--secondary); color: var(--muted-foreground); white-space: nowrap; }
.tag .ic { width: 12px; height: 12px; }
.tag.ok { background: var(--success-soft); color: var(--success); }
.tag.warn { background: var(--warning-soft); color: var(--warning); }
.tag.bad { background: var(--destructive-soft); color: var(--destructive); }
.tag.info { background: var(--info-soft); color: var(--info); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.mono-chip { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--code-background); border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.pmark { width: 26px; height: 26px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .02em; background: var(--secondary); color: var(--foreground); border: 1px solid var(--border-strong); flex: none; font-family: var(--font-mono); }
.pmark.sm { width: 20px; height: 20px; font-size: 9.5px; border-radius: 5px; }

/* Panels */
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel-head h2, .panel-head h3 { font-size: 14px; font-weight: 600; line-height: 20px; }
.panel-head .sub { font-size: 12.5px; color: var(--muted-foreground); margin-top: 1px; }
.panel-body { padding: 16px; }
.panel-foot { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted-foreground); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.section { display: grid; gap: 16px; margin-bottom: 24px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted-foreground); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--foreground); font-size: 14px; }

/* Notices */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); }
.notice > .ic { margin-top: 2px; }
.notice .n-title { font-weight: 600; }
.notice .n-body { color: var(--muted-foreground); font-size: 13px; margin-top: 2px; max-width: 80ch; }
.notice .n-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.notice.warn { border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); background: var(--warning-soft); }
.notice.warn > .ic { color: var(--warning); }
.notice.bad { border-color: color-mix(in srgb, var(--destructive) 40%, var(--border)); background: var(--destructive-soft); }
.notice.bad > .ic { color: var(--destructive); }
.notice.info > .ic { color: var(--info); }
.notice.ok > .ic { color: var(--success); }
.notice.proposal { border-style: dashed; border-color: color-mix(in srgb, var(--proposal) 50%, transparent); background: var(--proposal-soft); }

/* Prototype controls (reviewer-only, visually distinct) */
.proto-ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 16px; border: 1px dashed color-mix(in srgb, var(--proposal) 60%, transparent); border-radius: var(--radius); background: var(--proposal-soft); font-size: 12.5px; }

.proto-ctl .seg { background: transparent; border-color: color-mix(in srgb, var(--proposal) 35%, transparent); }

/* Tables */
.table-wrap { position: relative; min-width: 0; max-width: 100%; overflow-x: auto; }

table.data caption.sr-only { padding: 0; }
table.data th { text-align: left; font-weight: 550; font-size: 12px; color: var(--muted-foreground); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--card); }
table.data th.num { text-align: right; }
table.data td.mono { white-space: nowrap; }
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover td { background: color-mix(in srgb, var(--secondary) 55%, transparent); }
table.data tr.sel td { background: var(--accent-soft); }
table.data .cell-main { display: flex; align-items: center; gap: 10px; min-width: 0; }

table.data .sub { font-size: 12px; color: var(--muted-foreground); }
.row-btn { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; font-weight: 550; }
.row-btn:hover { color: var(--accent); }

/* Bars */
.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.meter .track { flex: 1; height: 6px; border-radius: 3px; background: var(--secondary); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.meter .fill { height: 100%; border-radius: 3px; background: var(--chart-1); }
.meter .fill.ok { background: var(--success); } .meter .fill.warn { background: var(--warning); } .meter .fill.bad { background: var(--destructive); }
.meter .v { font-family: var(--font-mono); font-size: 12px; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.spark { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; }
.spark i { width: 4px; border-radius: 1px; background: var(--success); opacity: .85; }
.spark i.f { background: var(--destructive); }
.spark i.z { background: var(--border-strong); height: 2px !important; opacity: 1; }

/* KPI band */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }

.kpi .v.na { font-size: 16px; line-height: 32px; color: var(--muted-foreground); font-weight: 550; letter-spacing: 0; }
.kpi-note { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted-foreground); padding: 8px 2px 0; }

/* Charts */
.chart-host { width: 100%; min-height: 60px; }
.chart { width: 100%; display: block; height: auto; overflow: visible; }
.chart text { fill: var(--muted-foreground); font-size: 11px; font-family: var(--font-mono); }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--border-strong); }

.chart rect.t { fill: var(--chart-1); }

.chart g.bar:hover rect.b, .chart g.bar:focus rect.b, .chart g.bar:hover rect.t, .chart g.bar:focus rect.t { filter: brightness(1.2); }
.chart g.bar:focus { outline: none; }
.chart g.bar:focus rect.hit { stroke: var(--ring); stroke-width: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart-readout { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); min-height: 18px; }
details.disclose > summary { cursor: pointer; font-size: 12.5px; color: var(--muted-foreground); padding: 8px 0 0; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.disclose > summary::-webkit-details-marker { display: none; }
details.disclose > summary::before { content: "▸"; font-size: 10px; transition: transform .12s; }
details.disclose[open] > summary::before { transform: rotate(90deg); }

/* Definition lists */
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 0; }
.facts dt, .facts dd { padding: 9px 0; border-bottom: 1px solid var(--border); }
.facts dt { color: var(--muted-foreground); padding-right: 24px; font-size: 13px; }
.facts dd { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-width: 0; }
.facts > :nth-last-child(-n+2) { border-bottom: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0 24px; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.kv > div span:first-child { color: var(--muted-foreground); }

/* Attention list */
.attn { display: grid; }
.attn li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.attn li:last-child { border-bottom: 0; }
.attn li > .ic { margin-top: 2px; }
.attn .t { font-weight: 550; }
.attn .s { font-size: 12.5px; color: var(--muted-foreground); }
.attn .go { margin-left: auto; white-space: nowrap; font-size: 13px; }

/* Split view */
.split { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.fam-list { padding: 6px; display: grid; gap: 1px; }
.fam-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.fam-list button:hover { background: var(--secondary); }
.fam-list button[aria-pressed="true"] { background: var(--secondary); box-shadow: inset 2px 0 0 var(--accent); }
.fam-list .n { font-weight: 550; }
.fam-list .m { font-size: 12px; color: var(--muted-foreground); }
.fam-list .badge { margin-left: auto; }
.fam-list .badge.on { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, transparent); background: var(--success-soft); }
.fam-sep { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; }

/* Logs */
.logbox { background: var(--code-background); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.logbox .lb-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted-foreground); }
.logtable { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
.logtable th { text-align: left; font-weight: 500; color: var(--faint); padding: 6px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--code-background); white-space: nowrap; }
.logtable td { padding: 5px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); white-space: nowrap; vertical-align: top; }
.logtable tr.lv-warn td { background: color-mix(in srgb, var(--warning-soft) 60%, transparent); }
.logtable tr.lv-error td { background: color-mix(in srgb, var(--destructive-soft) 70%, transparent); }
.logtable td.path { white-space: normal; word-break: break-all; color: var(--foreground); }
.logtable .lv { font-weight: 600; }
.lv-INFO { color: var(--muted-foreground); } .lv-WARN { color: var(--warning); } .lv-ERROR { color: var(--destructive); } .lv-DEBUG { color: var(--info); }
.st-2 { color: var(--success); } .st-3 { color: var(--muted-foreground); } .st-4 { color: var(--warning); } .st-5 { color: var(--destructive); }
.logscroll { max-height: 520px; overflow: auto; }
.logtable .exp td { white-space: pre-wrap; color: var(--muted-foreground); background: var(--card); }
.raw { margin: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: var(--muted-foreground); }

/* Code */
pre.code { margin: 0; background: var(--code-background); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; overflow: auto; color: var(--foreground); }

/* Config */
.config-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { display: grid; gap: 1px; position: sticky; top: 100px; }
.rail button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; border: 0; background: none; cursor: pointer; color: var(--muted-foreground); text-align: left; font-weight: 550; width: 100%; }
.rail button:hover { background: var(--secondary); color: var(--foreground); }
.rail button[aria-selected="true"] { background: var(--secondary); color: var(--foreground); box-shadow: inset 2px 0 0 var(--accent); }
.rail .idx { font-family: var(--font-mono); font-size: 11px; color: var(--faint); width: 18px; }
.rail .dirty { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); }
.config-tabs-narrow { display: none; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.form-grid .full { grid-column: 1 / -1; }
.savebar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; margin-top: 16px; border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--border)); background: color-mix(in srgb, var(--card) 92%, var(--warning) 8%); border-radius: var(--radius); }
.keyrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.keyrow:last-child { border-bottom: 0; }

/* Cards (store / oauth) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { font-size: 14px; font-weight: 600; }
.card .desc { font-size: 13px; color: var(--muted-foreground); }
.card .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }
.card .foot { margin-top: auto; display: flex; gap: 8px; align-items: center; justify-content: space-between; }

/* Steps */
.steps { display: grid; }
.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.steps li:last-child { border-bottom: 0; }
.steps .num-c { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-family: var(--font-mono); border: 1px solid var(--border-strong); color: var(--muted-foreground); }
.steps .done .num-c { background: var(--success-soft); color: var(--success); border-color: transparent; }

/* Dialogs */
dialog { color: var(--foreground); }
dialog.modal { padding: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--card); width: min(560px, calc(100% - 32px)); margin: 72px auto auto; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
dialog.modal.wide { width: min(760px, calc(100% - 32px)); }
dialog::backdrop { background: var(--overlay); }
dialog[open].modal { animation: dlgIn .18s cubic-bezier(.16,1,.3,1); }
@keyframes dlgIn { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
.dlg-head h2 { font-size: 16px; font-weight: 650; }
.dlg-head p { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
.dlg-body { padding: 16px 18px; display: grid; gap: 14px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.dlg-foot .left { margin-right: auto; font-size: 12.5px; color: var(--muted-foreground); }
.discard-bar { display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 18px; background: var(--warning-soft); border-top: 1px solid color-mix(in srgb, var(--warning) 40%, var(--border)); font-size: 13px; }
.discard-bar.on { display: flex; }
.discard-bar .grow { flex: 1; }
dialog.drawer { padding: 0; margin: 0; inset: 0 0 0 auto; height: auto; max-height: none; width: min(460px, 100%); max-width: 100%; border: 0; border-left: 1px solid var(--border-strong); background: var(--card); overflow: auto; }
dialog.drawer.left { inset: 0 auto 0 0; border-left: 0; border-right: 1px solid var(--border-strong); width: min(300px, 88%); background: var(--sidebar); }

dialog.drawer.left[open] { animation-name: drInL; }
@keyframes drIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drInL { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer .dlg-head { position: sticky; top: 0; background: inherit; z-index: 1; }
.drawer .nav { padding: 8px 10px 16px; }

/* Toasts */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--card); box-shadow: 0 12px 30px rgba(0,0,0,.3); font-size: 13px; animation: toastIn .18s ease-out; }

.toast.warn .ic { color: var(--warning); }
.toast b { display: block; }

/* Review sheet */
.review-list { display: grid; gap: 8px; }
.review-list li { font-size: 13px; padding-left: 14px; position: relative; }
.review-list li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--proposal); }
.route-index { display: grid; }
.route-index a { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border-radius: 6px; color: var(--foreground); }
.route-index a:hover { background: var(--secondary); text-decoration: none; }
.route-index a[aria-current="page"] { background: var(--secondary); box-shadow: inset 2px 0 0 var(--accent); }
.route-index .r { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); grid-column: 1 / -1; }

/* Login */
.login-wrap { display: grid; place-items: start center; padding: 72px 16px 48px; }
.login { width: min(420px, 100%); }
.login .brand-big { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.login .brand-big img { width: 44px; height: 44px; border-radius: 10px; }
.login .brand-big b { font-size: 18px; display: block; }
.login form { display: grid; gap: 16px; padding: 20px; }
.backend { font-family: var(--font-mono); font-size: 12.5px; padding: 8px 10px; border-radius: 6px; background: var(--code-background); border: 1px solid var(--border); word-break: break-all; }
.pw { position: relative; }
.pw .input { padding-right: 40px; }
.pw button { position: absolute; right: 3px; top: 3px; height: 28px; width: 32px; border: 0; background: none; color: var(--muted-foreground); cursor: pointer; border-radius: 4px; display: grid; place-items: center; }

/* Plugin frame */
.plugin-frame { border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
.plugin-frame .pf-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--secondary); font-size: 12px; color: var(--muted-foreground); flex-wrap: wrap; }
.plugin-frame .pf-body { padding: 16px; background: var(--background); }

/* Skeleton */
.skel { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--secondary), color-mix(in srgb, var(--secondary) 60%, var(--border-strong)), var(--secondary)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Alias diagram */
.alias-diagram { display: grid; grid-template-columns: 1fr 60px 1fr; gap: 8px 0; align-items: center; }
.alias-diagram .node { padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; background: var(--card); }
.alias-diagram .edge { height: 1px; background: var(--accent); position: relative; }
.alias-diagram .edge::after { content: ""; position: absolute; right: 0; top: -3px; border: 3.5px solid transparent; border-left: 6px solid var(--accent); }

/* Responsive (container queries track the embedded width, not the window) */
@container app (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--border); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container app (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar .menu-btn { display: inline-flex; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .config-layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .config-tabs-narrow { display: flex; }
}
@container app (max-width: 768px) {
  .page { padding: 18px 16px 48px; }
  .topbar, .demo-strip { padding-left: 12px; padding-right: 12px; }
  .grid-2, .grid-3, .form-grid { grid-template-columns: minmax(0, 1fr); }
  .page-head h1.hero { font-size: 24px; line-height: 30px; }
  .page-head .actions { width: 100%; }
  .kpi .v { font-size: 22px; }
  .hide-sm { display: none !important; }
  .search { max-width: none; flex-basis: 100%; }
  table.rt thead { display: none; }
  table.rt, table.rt tbody, table.rt tr, table.rt td { display: block; width: 100%; }
  table.rt tr { border-bottom: 1px solid var(--border); padding: 8px 4px; }
  table.rt tbody tr:last-child { border-bottom: 0; }
  table.rt td { border: 0; padding: 4px 8px; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  table.rt td::before { content: attr(data-label); color: var(--muted-foreground); font-size: 12px; text-align: left; flex: none; }
  table.rt td.lead { justify-content: flex-start; text-align: left; }
  table.rt td.lead::before { content: none; }
  table.rt td:empty { display: none; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .facts dt { padding-bottom: 0; border-bottom: 0; }
  .facts dd { padding-top: 2px; }
  .logtable .hide-sm { display: none; }
  .alias-diagram { grid-template-columns: 1fr 28px 1fr; }
  .steps li { grid-template-columns: 28px 1fr; }
  .steps li > :last-child { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  #root *, #root *::before, #root *::after, dialog, dialog::backdrop { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .skel { background: var(--secondary); }
}

function validateProv(form, field) {

  else if (u.startsWith('http://') && !/^http:\/\/(10\.|127\.|192\.168\.|localhost)/.test(u)) errs.url = 'Plain http sends the key unencrypted. Use https for remote hosts.';

/* ---------- Quota ---------- */
function effQuota(id) {
  const base = S.quotaRows[id];
  if (base && base._live) return base._live;
  if (S.quota === 'notloaded') return { kind: 'notloaded' };
  if (S.quota === 'loading') return { kind: 'loading' };
  if (S.quota === 'error') return { kind: 'error', msg: 'Network error reaching the upstream quota API. Retry in a moment.' };
  return base || { kind: 'notloaded' };
}
function quotaRow(c) {
  const q = effQuota(c.id); const w = S.quotaWin;
  let state, reset = '<span class="muted">Not reported</span>', snap = '';
  if (q.kind === 'loaded' || q.kind === 'stale') {
    const win = q[w];
    state = win ? `${meter(win.left)}${win.note ? `<div class="sub">${esc(win.note)}</div>` : ''}` : `<span class="muted">No ${w === '5h' ? '5-hour' : 'weekly'} window for this account</span>`;
    if (win) reset = `<span class="mono">${esc(win.reset)}</span>`;
    snap = q.kind === 'stale' ? `<span class="tag warn">${ic('clock')}${q.snap}</span>` : `<span class="mono muted">${q.snap}</span>`;
  } else if (q.kind === 'loading') { state = '<span class="skel" style="width:160px"></span><span class="sr-only">Loading</span>'; snap = '<span class="muted">Loading</span>'; }
  else if (q.kind === 'error') { state = `<span class="tag bad">${ic('error')}Check failed</span><div class="sub">${esc(q.msg)}</div>`; snap = '<span class="muted">n/a</span>'; }
