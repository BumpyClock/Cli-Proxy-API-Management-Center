<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revised quota and dashboard design</title>
<style>
:root{--font-sans:system-ui,sans-serif;--radius:8px}html,body{margin:0;padding:0}*{box-sizing:border-box}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:500 13px/1.4 var(--font-sans);min-height:40px;padding:8px 14px;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}button[aria-pressed=true]{color:var(--primary-foreground);background:var(--primary);border-color:var(--primary)}button:focus-visible{outline:2px solid var(--ring);outline-offset:3px}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border-radius:var(--radius)}.mobile{max-width:390px;margin-inline:auto}p{font:12px/1.5 var(--font-sans);color:var(--muted-foreground);margin:10px 0 0}
</style></head>
<body><main><nav aria-label="Design preview"><button type="button" data-view="quota" aria-pressed="true">Quota</button><button type="button" data-view="dashboard" aria-pressed="false">Dashboard</button><button type="button" data-view="light" aria-pressed="false">Light</button><button type="button" data-view="mobile" aria-pressed="false">Mobile</button></nav>
<figure id="quota"><img src="/Users/adityasharma/Projects/Cli-Proxy-API-Management-Center/design-review/proposed/final/quota-728.png" alt="Quota redesign with automatic checks, explicit partial-failure status, a shared percentage chart, numbered account traces, dashed reset projections, and compact account filters. Sample data."></figure>
<figure id="dashboard" hidden><img src="/Users/adityasharma/Projects/Cli-Proxy-API-Management-Center/design-review/proposed/final/dashboard-728.png" alt="Dashboard chart detail with numbered success and failure series, matching line styling, keyboard inspection, time-window controls, and an exact data table. Sample data."></figure>
<figure id="light" hidden><img src="/Users/adityasharma/Projects/Cli-Proxy-API-Management-Center/design-review/proposed/final/quota-light-728.png" alt="The revised quota chart and partial-refresh status in light mode. Sample data."></figure>
<figure id="mobile" hidden><img class="mobile" src="/Users/adityasharma/Projects/Cli-Proxy-API-Management-Center/design-review/proposed/final/quota-390.png" alt="Quota design at 390 by 844 pixels. Compact header, two-column series controls, and the plot visible without opening filters. Sample data."></figure>
<p>Static prototype captures. Open redesign.html for all 16 interactive screens. No live changes.</p></main>
<script>document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;document.querySelectorAll('figure').forEach(x=>{x.hidden=x.id!==b.dataset.view});document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script>
</body></html>
